# Nightly copy of the live database. Supabase's free plan keeps no backups
# we can download, so this is the backup: a pg_dump of the app's tables,
# encrypted, kept as a workflow artifact for 30 days.
#
# Encrypted because artifacts of a public repository can be downloaded by any
# GitHub user, and the dump holds staff names, emails and password hashes.
# Nothing unencrypted is ever uploaded.
#
# Needs two repository secrets:
#   BACKUP_DATABASE_URL  the Supabase "Session pooler" connection string
#                        (port 5432). The transaction pooler the app uses
#                        (6543) is not suitable for pg_dump, and the direct
#                        host is IPv6-only, which GitHub's runners cannot reach.
#   BACKUP_PASSPHRASE    a long passphrase, kept somewhere other than GitHub.
#                        Without it a backup cannot be opened.
#
# It does not copy uploaded files (the storage bucket); those are not in the
# database.
#
# Restore:
#   gpg --decrypt limsl-YYYY-MM-DD.dump.gpg > limsl.dump
#   pg_restore --no-owner --no-privileges --clean --if-exists -d "<connection string>" limsl.dump

name: Database backup

on:
  schedule:
    - cron: "0 1 * * *" # 01:00 UTC, 02:00 in Lagos, when nobody is working
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install the Postgres 17 client
        # The server is Postgres 17; an older pg_dump refuses to dump it.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17

      - name: Dump the database
        id: dump
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$PASSPHRASE" ]; then
            echo "::error::Set both repository secrets, BACKUP_DATABASE_URL and BACKUP_PASSPHRASE."
            exit 1
          fi
          FILE="limsl-$(date -u +%F).dump"
          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL" \
            --schema=public --format=custom --no-owner --no-privileges \
            --file="$FILE"
          # A dump that cannot be listed cannot be restored; fail now, not on the day it is needed.
          /usr/lib/postgresql/17/bin/pg_restore --list "$FILE" > /dev/null
          TABLES=$(/usr/lib/postgresql/17/bin/pg_restore --list "$FILE" | grep -c " TABLE DATA public " || true)
          echo "Backup $FILE: $(du -h "$FILE" | cut -f1), $TABLES tables"
          if [ "$TABLES" -lt 50 ]; then
            echo "::error::Only $TABLES tables in the dump; expected about 62."
            exit 1
          fi
          printf '%s' "$PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 \
            --output "$FILE.gpg" "$FILE"
          rm -f "$FILE"
          echo "file=$FILE.gpg" >> "$GITHUB_OUTPUT"

      - name: Keep it for 30 days
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dump.outputs.file }}
          path: ${{ steps.dump.outputs.file }}
          retention-days: 30
          if-no-files-found: error
